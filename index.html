<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoción Sesión Nupcial</title>
    <!-- Importar fuentes similares a la imagen -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fondo borroso general */
            background-image: url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Capa para difuminar el fondo de la página */
        .bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        .poster-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
        }

        .card {
            background-color: #f4f3ef; /* Color crema similar a la imagen */
            padding: 50px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        /* Decoraciones de las esquinas (marcadores de posición) */
        .corner {
            position: absolute;
            width: 80px;
            height: 80px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10,10 Q50,10 50,50 Q50,90 90,90" fill="none" stroke="%23e0ddcd" stroke-width="3"/></svg>'); /* Reemplazar con PNG de filigrana real */
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.8;
        }
        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; transform: scaleX(-1); }
        .bottom-left { bottom: 15px; left: 15px; transform: scaleY(-1); }
        .bottom-right { bottom: 15px; right: 15px; transform: scale(-1, -1); }

        /* Contenedor ovalado para la foto */
        .oval-mask {
            width: 85%;
            margin: 0 auto;
            aspect-ratio: 3 / 4.2;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .oval-mask img.bg-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1); /* Efecto blanco y negro */
        }

        /* Contenido superpuesto sobre la foto */
        .overlay-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 20px;
            /* Sutil degradado oscuro para que el texto resalte */
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%);
        }

        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            line-height: 0.9;
            margin-bottom: 20px;
            font-weight: 400;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .swans-icon {
            width: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(1px 1px 3px rgba(0,0,0,0.5));
        }

        .discount {
            font-size: 1rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }

        .discount strong {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .legal {
            font-size: 0.65rem;
            font-weight: 300;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }

        /* Textos exteriores (Footer) */
        .poster-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .footer-left { text-align: left; }
        .footer-right { text-align: right; }
        .footer-light { font-weight: 300; font-style: italic; }

        @media (max-width: 500px) {
            .title { font-size: 3rem; }
            .card { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-blur"></div>
    
    <div class="poster-container">
        <div class="card">
            <!-- Esquinas ornamentales -->
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <!-- Centro Ovalado -->
            <div class="oval-mask">
                <!-- Reemplaza el src con la foto de tus clientes -->
                <img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Pareja abrazándose" class="bg-photo">
                
                <div class="overlay-content">
                    <p class="subtitle">Disfruta de una</p>
                    <h1 class="title">Sesión de<br>fotos nupcial</h1>
                    
                    <!-- Icono de cisnes. Reemplazar con el SVG o PNG exacto si lo tienes -->
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Swan_icon_white.svg" alt="Cisnes" class="swans-icon">
                    
                    <p class="discount">AL <strong>50%</strong> DE DESCUENTO</p>
                    <p class="legal">*Válido por tiempo limitado</p>
                </div>
            </div>
        </div>

        <!-- Textos inferiores fuera de la tarjeta -->
        <div class="poster-footer">
            <div class="footer-left">
                Promoción boda<br>
                <span class="footer-light">Enero 2035</span>
            </div>
            <div class="footer-right">
                Silvana Ochoa Fotografía<br>
                <span class="footer-light">@sitioincreible</span>
            </div>
        </div>
    </div>
</body>
</html>
